# 릴리즈 — main 에서 수동 dispatch 시 다섯 플랫폼 타깃마다 사이드카 dist 아카이브를 빌드해
# owner-immutable GitHub Release 자산으로 올린다. 각 타깃은 그 타깃의 네이티브 러너에서
# 빌드한다. 엔진(libghostty-vt.a)은 pinned ghostty 소스에서 Zig 로 네이티브 빌드해 build.rs 가
# 링크한다(Zig 0.16.0 = ghostty minimum_zig_version, exact commit = README 빌드 요구).
# 버전/태그는 소유 manifest(Cargo.toml)에서 유도하고 sidecar.json 과의 일치를
# build-release 가 판정한다.
# publish 는 매트릭스 전체를 내려받아 소유 릴리즈 manifest(release.json)와 conformance 리포트
# 3종을 합성하고, 핀된 공개 soksak-spec 검증기로 판정한 뒤에만 자산으로 올린다 — 서명 레지스트리
# 인덱스가 릴리즈를 실을 수 있는 것은 이 manifest 뿐이다.
# 소비측(플러그인 manifest sidecars[].reach.fetch.url[platform] + sha256[platform])이 자산을 집는다.
name: release

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: soksak-sidecars/soksak-sidecar-terminal-ghostty
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: soksak-sidecars/soksak-sidecar-terminal-ghostty
      - id: rust-toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel = \"\(.*\)\"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: ${{ matrix.target }}
      - name: Install the exact Zig toolchain
        shell: bash
        run: ./scripts/install-zig.sh
      - id: identity
        shell: bash
        run: |
          ver="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          case "$ver" in ''|*[!0-9.]*) echo "invalid version: $ver" >&2; exit 1;; esac
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      - name: Build libghostty-vt from pinned ghostty source (Zig)
        shell: bash
        run: |
          set -euo pipefail
          ghostty="$RUNNER_TEMP/ghostty-source"
          git init -q "$ghostty"
          git -C "$ghostty" remote add origin https://github.com/min-median-max/ghostty.git
          git -C "$ghostty" fetch -q --depth 1 origin libghostty-vt-0.1.0-dev
          git -C "$ghostty" -c advice.detachedHead=false checkout -q FETCH_HEAD
          test "$(git -C "$ghostty" rev-parse HEAD)" = 9ae02a326f62bd88f7f5508cf1807c67e7775cb5
          ( cd "$ghostty" && zig build -Demit-lib-vt=true -Doptimize=ReleaseFast -Dcpu=baseline )
          printf '%s\n' 9ae02a326f62bd88f7f5508cf1807c67e7775cb5 > "$ghostty/zig-out/source-commit.txt"
          printf '%s\n' 0.16.0 > "$ghostty/zig-out/zig-version.txt"
          # ghostty 정적 라이브러리 이름은 플랫폼마다 다르다: Windows 는 ghostty-vt-static.lib
          # (DLL import lib 과의 충돌 회피, build.zig), 나머지는 libghostty-vt.a. build.rs 가
          # 같은 규칙으로 링크한다.
          case "${{ matrix.target }}" in
            *windows*) test -f "$ghostty/zig-out/lib/ghostty-vt-static.lib" ;;
            *)         test -f "$ghostty/zig-out/lib/libghostty-vt.a" ;;
          esac
          echo "SOKSAK_GHOSTTY_VT_LIB=$ghostty/zig-out/lib" >> "$GITHUB_ENV"
      - name: Build and stage the release binary for this target
        shell: bash
        run: ./stage.sh dist "${{ matrix.target }}"
      - name: Execute the staged binary on its native release runner
        shell: bash
        run: ./scripts/release-smoke.sh "${{ matrix.target }}" dist
      - id: archive
        shell: bash
        run: |
          ver="${{ steps.identity.outputs.version }}"
          out="soksak-sidecar-terminal-ghostty-$ver-${{ matrix.target }}.tar.gz"
          mkdir -p package/dist
          cp dist/sidecar.json package/sidecar.json
          cp LICENSE THIRD-PARTY-NOTICES package/
          cp dist/soksak-sidecar-terminal-ghostty* package/dist/
          tar -czf "$out" -C package LICENSE THIRD-PARTY-NOTICES sidecar.json dist
          # sha256 도구는 러너마다 다르다 — macOS 는 shasum(perl), linux·windows(git-bash)
          # 는 sha256sum(coreutils). 둘 다 "<hex>  <file>" 형식으로 동일하다.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$out" | tee "$out.sha256"
          else
            shasum -a 256 "$out" | tee "$out.sha256"
          fi
          echo "asset=$out" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist-${{ matrix.target }}
          path: |
            soksak-sidecars/soksak-sidecar-terminal-ghostty/${{ steps.archive.outputs.asset }}
            soksak-sidecars/soksak-sidecar-terminal-ghostty/${{ steps.archive.outputs.asset }}.sha256
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: soksak-sidecars/soksak-sidecar-terminal-ghostty
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: soksak-sidecars/soksak-sidecar-terminal-ghostty
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: soksak-ai/soksak-spec
          ref: 4c83e41a0aa168bc4c2e11100aba242277c731b6
          path: soksak-sidecars/soksak-sidecar-terminal-ghostty/.dependency/soksak-spec
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          package_json_file: soksak-sidecars/soksak-sidecar-terminal-ghostty/.dependency/soksak-spec/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: soksak-sidecars/soksak-sidecar-terminal-ghostty/.dependency/soksak-spec/package.json
      - id: identity
        run: |
          ver="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          case "$ver" in ''|*[!0-9.]*) echo "invalid version: $ver" >&2; exit 1;; esac
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: dist-*
          path: soksak-sidecars/soksak-sidecar-terminal-ghostty/dist
          merge-multiple: true
      - name: Build the exact public validator without links
        working-directory: soksak-sidecars/soksak-sidecar-terminal-ghostty/.dependency/soksak-spec
        run: |
          pnpm --config.node-linker=hoisted --config.symlink=false install --frozen-lockfile
          pnpm build
          test -z "$(find . -type l -print -quit)"
      - run: node .dependency/soksak-spec/packages/plugin-spec/release-template/sidecar/build-release.mjs --commit "${{ github.sha }}" --tag "${{ steps.identity.outputs.tag }}" --artifacts dist --out dist-release
      - run: node .dependency/soksak-spec/packages/plugin-spec/release-template/sidecar/validate-with-spec.mjs --spec-root .dependency/soksak-spec --release-dir dist-release
      - name: Create least-privilege release token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.SOKSAK_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.SOKSAK_RELEASE_PRIVATE_KEY }}
          permission-administration: read
          permission-contents: write
      - name: Collect the canonical public asset set
        run: |
          mkdir publish-assets
          find dist -maxdepth 1 -type f -name '*.tar.gz' -exec cp {} publish-assets/ \;
          cp dist-release/*.json publish-assets/
      - name: Publish through owner-enforced immutable releases
        env:
          SOKSAK_RELEASE_TOKEN: ${{ steps.release-token.outputs.token }}
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        run: |
          test "$(gh api "repos/${{ github.repository }}/immutable-releases" --jq '.enabled and .enforced_by_owner')" = "true" || { echo "owner-enforced immutable releases must be enabled before tagging" >&2; exit 1; }
          node .dependency/soksak-spec/packages/plugin-spec/release-template/publish-canonical-release.mjs --repository "${{ github.repository }}" --commit "${{ github.sha }}" --artifacts "$GITHUB_WORKSPACE/soksak-sidecars/soksak-sidecar-terminal-ghostty/publish-assets" --manifest "$GITHUB_WORKSPACE/soksak-sidecars/soksak-sidecar-terminal-ghostty/publish-assets/release.json"
